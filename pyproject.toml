[project]
name = "atlas-agpm"
version = "0.1.0"
description = "Еженедельный Атлас агентного управления проектами по материалам AgPM Radar"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
